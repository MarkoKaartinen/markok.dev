{{- $icon := resources.Get (print "icons/" . ".svg") -}}
{{- if $icon -}}
  <span class="icon relative inline-block px-1 align-text-bottom" style="display:inline-block;width:1em;height:1em;vertical-align:text-bottom;">
    {{- $icon.Content | replaceRE `<svg ` `<svg width="1em" height="1em" ` | safeHTML -}}
  </span>
{{- end -}}
